<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container login-container">
  <h2>Welcome Back</h2>

  <div class="input-group">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <label class="show-pass">
      <input type="checkbox" id="show-pass"> Show password
    </label>
  </div>

  <button class="btn-login" onclick="login()">Sign In</button>
  <div id="msg"></div>
</div>

<script>
// Keep the saved theme on the login page too
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-mode');
}

// Show / hide password
document.getElementById('show-pass').addEventListener('change', function () {
  document.getElementById('password').type = this.checked ? 'text' : 'password';
});

// Press Enter to sign in
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') login();
});

function login() {
  const userIn = document.getElementById('username').value.trim();
  const passIn = document.getElementById('password').value;
  const msgArea = document.getElementById('msg');

  fetch('users.xml')
    .then(res => res.text())
    .then(xmlStr => {
      const xmlDoc = new DOMParser().parseFromString(xmlStr, 'text/xml');
      const users = xmlDoc.getElementsByTagName('user');
      let isValid = false;

      for (let i = 0; i < users.length; i++) {
        const u = users[i].getElementsByTagName('username')[0].textContent;
        const p = users[i].getElementsByTagName('password')[0].textContent;
        if (u === userIn && p === passIn) {
          isValid = true;
          break;
        }
      }

      if (isValid) {
        sessionStorage.setItem('loggedIn', 'true');
        msgArea.style.color = 'green';
        msgArea.textContent = 'Login successful! Redirecting...';
        setTimeout(() => window.location.href = 'portal.html', 1000);
      } else {
        msgArea.style.color = 'red';
        msgArea.textContent = 'Invalid username or password!';
      }
    })
    .catch(() => {
      msgArea.style.color = 'red';
      msgArea.textContent = 'Could not load user data. Run the site through a server.';
    });
}
</script>
</body>
</html>
